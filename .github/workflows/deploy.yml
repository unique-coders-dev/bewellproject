name: Build and deploy the React site to Hostinger (manual only)

# The automatic push trigger is deliberately removed.
#
# This workflow uploads dist/ to canvassing.org's public_html root. Once
# WordPress is serving that document root, a merge to main would drop a React
# index.html next to WordPress's index.php — and Hostinger serves index.html
# first, so the site would silently revert to the old build with every check
# still green. Nothing in the logs would say anything was wrong.
#
# The React site is still the live one until the domain is pointed at the
# WordPress install, so this is kept runnable by hand for a hotfix:
# Actions -> this workflow -> Run workflow.
#
# Once canvassing.org is on WordPress, delete this file.

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the build rather than shipping a bundle wired to a dead Supabase
      # project. A site that silently discards applications is worse than a
      # failed deploy.
      - name: Verify Supabase secrets are present
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set as repository secrets."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *placeholder*) echo "::error::VITE_SUPABASE_URL still points at a placeholder host."; exit 1 ;;
          esac

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Vite writes only the built site to dist/, so nothing from the repo
      # source tree (including any local .env) can reach the server.
      - name: Deploy dist/ to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # The FTP account u174852759.canvassing.org is already chrooted to the
          # domain's public_html, so this must stay "./" — "./public_html/" makes
          # a nested public_html/public_html/ that the web server never serves.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
